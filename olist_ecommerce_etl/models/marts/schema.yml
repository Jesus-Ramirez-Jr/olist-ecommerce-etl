version: 2

models:
  - name: mart_first_order_retention
    description: >
      One row per unique customer (customer_unique_id). Built to answer:
      is there a relationship between a customer's review score on their
      first order and whether they ever order again? When a first order
      received more than one review submission, the most recent response
      (by review_answer_timestamp) is used.
    columns:
      - name: customer_unique_id
        description: >
          The true, person-level customer identifier (from stg_customers),
          not the per-order customer_id. This is the grain key for the mart.
        tests:
          - unique
          - not_null

      - name: reordered
        description: >
          True if this customer placed more than one order across the
          full order history, false if their first order was their only order.
        tests:
          - not_null

      - name: first_order_review_score
        description: >
          The review score (1-5) left on the customer's first order.
          Null when the customer never left a review on that order.
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false

  - name: mart_customer_repeat_rate
    description: >
      One row per unique customer (customer_unique_id). Flags whether the
      customer placed more than one order, and captures the state
      associated with their first order. Note: repeat rates by state are
      sensitive to sample size — states with small customer counts show
      volatile rates and should be filtered (e.g. minimum ~1,000 customers)
      before comparing across states.
    columns:
      - name: customer_unique_id
        description: The true person-level customer identifier.
        tests:
          - unique
          - not_null
      - name: first_order_state
        description: customer_state from the customer's earliest order by purchase timestamp.
        tests:
          - not_null
      - name: reordered
        description: True if the customer placed more than one order.
        tests:
          - not_null

  - name: mart_time_between_orders
    description: >
      One row per customer (customer_unique_id) who has placed more than one
      order. Captures the timestamps of the customer's first and second orders
      and the number of days between them. Answers: among customers who
      reorder, how much time typically passes between their first and second
      order?

    columns:
      - name: customer_unique_id
        description: >
          The unique, person-level customer identifier (from stg_customers).
          This is the grain of the mart.
        tests:
          - unique
          - not_null

      - name: first_order_id
        description: order_id of the customer's first order, by order_purchase_timestamp.
        tests:
          - not_null

      - name: first_order_timestamp
        description: Timestamp of the customer's first order.
        tests:
          - not_null

      - name: second_order_id
        description: order_id of the customer's second order, by order_purchase_timestamp.
        tests:
          - not_null

      - name: second_order_timestamp
        description: Timestamp of the customer's second order.
        tests:
          - not_null

      - name: days_between_orders
        description: >
          Number of calendar days between the customer's first and second
          order, computed as TIMESTAMP_DIFF(second_order_timestamp,
          first_order_timestamp, DAY). A value of 0 means both orders were
          placed on the same calendar day.
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

  - name: mart_category_revenue_and_volume
    description: >
      One row per product category (English translation where available, raw
      Portuguese name where untranslated, 'uncategorized' where the product has
      no category at all). Built from delivered orders only — canceled,
      unavailable, and in-progress statuses (shipped, invoiced, processing,
      approved) are excluded since this is a static historical extract and
      those orders' final outcomes are unknown. Answers business question 4:
      which categories drive the most revenue, and does that ranking hold up
      by order volume instead.
    columns:
      - name: product_category_name_english
        description: Product category grain key — English name, raw Portuguese fallback, or 'uncategorized'.
        tests:
          - unique
          - not_null
      - name: order_count
        description: Distinct delivered orders containing at least one product in this category.
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: total_revenue
        description: Sum of order item price for this category, delivered orders only.
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: revenue_rank
        description: Category's rank by total_revenue, 1 = highest.
      - name: order_count_rank
        description: Category's rank by order_count, 1 = highest.