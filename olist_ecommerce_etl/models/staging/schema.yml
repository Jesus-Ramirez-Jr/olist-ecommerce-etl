version: 2

models:
  - name: stg_order_reviews
    description: >
      Staging model for order reviews. One-to-one with the raw `order_reviews`
      source table — renaming and casting only, no business logic.
      Note: review_id is NOT guaranteed unique on its own; the same review_id
      can appear against multiple order_ids in the source data. Use
      surrogate_key (hashed from review_id + order_id) as the actual grain
      of this model for any downstream joins or uniqueness checks.
    columns:
      - name: surrogate_key
        description: >
          Composite key hashed from review_id and order_id via
          dbt_utils.generate_surrogate_key. This is the real primary key
          of this model — review_id alone is not unique.
        tests:
          - unique

      - name: review_id
        description: >
          Review identifier as provided by the source system. Not unique
          on its own — see model-level description.
        tests:
          - not_null

      - name: order_id
        description: Foreign key to the order this review is associated with.
        tests:
          - not_null

      - name: review_score
        description: Customer satisfaction score provided by the source (integer scale).
        tests:
          - not_null

      - name: review_comment_title
        description: >
          Free-text review title entered by the customer. Nullable by design —
          many reviews have no title. No test applied; a not_null test here
          would fail on legitimately valid rows.

      - name: review_comment_message
        description: >
          Free-text review body entered by the customer. Nullable by design —
          same reasoning as review_comment_title.

      - name: review_creation_date
        description: Date the review was submitted by the customer.
        tests:
          - not_null

      - name: review_answer_timestamp
        description: Timestamp when the seller/marketplace responded to the review.
        tests:
          - not_null

  - name: stg_order_items
    description: >
      Staging model for order line items. Grain is the composite of
      order_id and order_item_id — an order with multiple items has
      multiple rows here. Confirmed against live data: total row count
      equals distinct (order_id, order_item_id) pairs.
    columns:
      - name: surrogate_key
        description: >
          Composite key hashed from order_id and order_item_id via
          dbt_utils.generate_surrogate_key. This is the actual grain
          of this model.
        tests:
          - unique

      - name: order_id
        tests:
          - not_null

      - name: order_item_id
        description: Sequential line-item number scoped within a single order.
        tests:
          - not_null

      - name: product_id
        tests:
          - not_null

      - name: seller_id
        tests:
          - not_null

      - name: shipping_limit_date
        description: Deadline for the seller to hand the item to the logistics partner.
        tests:
          - not_null

      - name: price
        tests:
          - not_null

      - name: freight_value
        tests:
          - not_null

  - name: stg_order_payments
    description: >
      Staging model for order payments. Grain is the composite of
      order_id and payment_sequential — an order paid via multiple
      methods (e.g. voucher plus credit card) has multiple rows here.
      Confirmed against live data: total row count equals distinct
      (order_id, payment_sequential) pairs.
    columns:
      - name: surrogate_key
        description: >
          Composite key hashed from order_id and payment_sequential via
          dbt_utils.generate_surrogate_key. This is the actual grain
          of this model.
        tests:
          - unique

      - name: order_id
        tests:
          - not_null

      - name: payment_sequential
        description: Sequence number of this payment method within the order, when multiple payment methods were used.
        tests:
          - not_null

      - name: payment_type
        tests:
          - not_null

      - name: payment_installments
        tests:
          - not_null

      - name: payment_value
        tests:
          - not_null

  - name: stg_customers
    description: >
      Staging model for customers. One row per order-customer pairing,
      matching the raw table's grain — customer_id is unique here, but
      customer_unique_id is not (a real customer can place multiple
      orders, each with a different customer_id). Do not deduplicate
      this model to person-level; that's a downstream/mart concern.
    columns:
      - name: customer_id
        description: Order-scoped customer identifier. The grain of this model.
        tests:
          - unique
          - not_null

      - name: customer_unique_id
        description: >
          The actual stable identity of a real customer across orders.
          Not unique in this table by design — do not test it as such.
        tests:
          - not_null

      - name: customer_zip_code_prefix
        tests:
          - not_null

      - name: customer_city
        tests:
          - not_null

      - name: customer_state
        tests:
          - not_null